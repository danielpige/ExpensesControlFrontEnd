<div class="grid grid-cols-1 p-10">
  <div class="flex justify-end my-3 mx-3">
    <button matTooltip="Recargar tabla" mat-icon-button color="primary" (click)="refresh.emit()">
      <mat-icon class="hover:animate-spin">cached</mat-icon>
    </button>
  </div>
  <div class="shadow-xl h-[300px] overflow-y-auto" *ngIf="!loading">
    <table mat-table [dataSource]="dataSource" class="w-full" matSort>
      @for (column of columns; track column.propertyValue) {
      <ng-container [matColumnDef]="column.propertyValue">
        <th mat-header-cell *matHeaderCellDef>{{ column.title | titlecase }}</th>
        <td mat-cell *matCellDef="let element"><app-row-by-type [column]="column" [data]="element"></app-row-by-type></td>
      </ng-container>
      }

      <ng-container *ngIf="hasActions" matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let element">
          <app-row-actions (selectedAction)="onSelectedAction($event, element)" [actions]="actions" [data]="element"></app-row-actions>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row (click)="onRowClicked(row)" *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
  <mat-paginator
    *ngIf="hasPagination"
    class="w-full"
    itemsPerPageLabel="'Items por pagina'"
    (page)="onChangePaginator($event)"
    [length]="pageEvent.length"
    [pageSize]="pageEvent.pageSize"
    [pageIndex]="pageEvent.pageIndex"
    [pageSizeOptions]="[5, 10, 25, 100]"
    aria-label="Select page"
  >
  </mat-paginator>
  <div *ngIf="loading" class="p-4 h-500 flex justify-center items-center">
    <mat-spinner></mat-spinner>
  </div>
</div>
