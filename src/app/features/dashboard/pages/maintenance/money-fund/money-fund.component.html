<div class="flex justify-between items-center my-3 mx-3">
  <h2>Fondos</h2>
  <button mat-raised-button color="primary" (click)="openFormModal()">Crear nuevo fondo</button>
</div>

<mat-divider></mat-divider>

<app-generic-table
  [actions]="actions"
  [dataSource]="dataSource()"
  [loading]="loading()"
  [columns]="columns"
  [pageEvent]="pageEvent()"
  (paged)="chagePagination($event)"
  (selectedAction)="onSelecteAction($event)"
  (refresh)="forceReload()"
></app-generic-table>
