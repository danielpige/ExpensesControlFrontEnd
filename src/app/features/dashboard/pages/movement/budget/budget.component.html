<div class="flex justify-between items-center my-3 mx-3">
  <h2>Presupuesto</h2>
  <button mat-raised-button color="primary" (click)="openFormModal()">Crear presupuesto</button>
</div>

<mat-divider></mat-divider>

<mat-card class="mt-3 mx-4 px-4">
  <form class="grid grid-cols-3 py-4" (ngSubmit)="onSearch()">
    <div class="m-2">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Mes y año</mat-label>
        <input readonly matInput [matDatepicker]="dp" [formControl]="date" />
        <mat-hint>MM/YYYY</mat-hint>
        <mat-datepicker-toggle matIconSuffix [for]="dp"></mat-datepicker-toggle>
        <mat-datepicker #dp startView="multi-year" (monthSelected)="setMonthAndYear($event, dp)" panelClass="example-month-picker">
        </mat-datepicker>
      </mat-form-field>
    </div>

    <div class="mt-4">
      <button mat-raised-button color="accent" type="submit" [disabled]="!selectedYear || !selectedMonth">
        Cargar <mat-icon>filter_alt</mat-icon>
      </button>
    </div>
  </form>
</mat-card>

<app-generic-table
  [actions]="actions"
  [dataSource]="dataSource()"
  [loading]="loading()"
  [columns]="columns"
  (selectedAction)="onSelecteAction($event)"
  (refresh)="onSearch()"
  [hasPagination]="false"
></app-generic-table>
